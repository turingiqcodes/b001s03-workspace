[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-oncall-agent"
version = "1.0.0"
description = "Monitors Apache Airflow 3.x, investigates failures, manages Linear incidents and safely retries eligible tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
# Production secret retrieval from AWS SSM Parameter Store (NFR-008).
aws = ["boto3>=1.34,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
oncall-agent = "oncall_agent.cli:main"
oncall-airflow-mcp = "oncall_agent.mcp_servers.airflow_server:main"
oncall-linear-mcp = "oncall_agent.mcp_servers.linear_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oncall_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast tests with no I/O beyond temp files",
    "integration: integration clients exercised against mocked HTTP",
    "e2e: full agent cycles against mock integrations",
]
