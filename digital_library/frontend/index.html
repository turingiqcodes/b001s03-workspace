<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='5' fill='%231f4d3a'/%3E%3Cpath d='M10 6C8.5 5 6.5 4.6 5 4.7v9.6c1.5-.1 3.5.3 5 1.3 1.5-1 3.5-1.4 5-1.3V4.7c-1.5-.1-3.5.3-5 1.3z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script>
  // Theme and density before first paint, so a dark-theme user never sees a white flash (same rule as lib.js applyPrefs).
  try { const p = JSON.parse(localStorage.getItem('dl.prefs') || '{}');
    if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme;
    if (p.density === 'compact') document.documentElement.dataset.density = 'compact'; } catch (e) { /* defaults */ }
</script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar"></header>
  <nav class="sidebar" aria-label="Main"></nav>
  <main tabindex="-1"><div class="loading" role="status">Loading…</div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
